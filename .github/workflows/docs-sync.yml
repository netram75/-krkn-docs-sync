name: docs-sync

on:
  push:
    branches: [main]
    paths:
      - 'scenario_plugins/**/*.py'
      - 'scenarios/**/*.py'
  workflow_dispatch:
    inputs:
      target_file:
        description: 'Scenario file path (for manual testing)'
        required: false
        default: 'tests/fixtures/vmi_network_chaos.py'

jobs:
  sync-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run docs-sync pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TARGET_FILE: ${{ github.event.inputs.target_file }}
        run: python src/main.py
